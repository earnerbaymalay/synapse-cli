[project]
name = "lab"
version = "0.1.0"
description = "AI CLI WORK unified toolkit: privacy audit, command center, pentest-scope wrappers"
requires-python = ">=3.11"
dependencies = ["rich", "httpx"]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
