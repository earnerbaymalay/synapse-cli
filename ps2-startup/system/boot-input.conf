# Boot-time mpv bindings (loaded with --no-input-default-bindings).
# Skipping jumps to the final frame instead of quitting, so the hand-off to the
# login screen stays seamless. Nothing else is bound: this mpv runs as root
# before login, so the default console / command bindings must stay unreachable.
ESC    seek 100 absolute-percent+exact
ENTER  seek 100 absolute-percent+exact
SPACE  seek 100 absolute-percent+exact
q      seek 100 absolute-percent+exact
