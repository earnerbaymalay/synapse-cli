<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omni-Screensaver // Y2K Geomorphic Cybernetic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
    body, html { width: 100%; height: 100%; background: #0b0b12; font-family: 'JetBrains Mono', 'Fira Code', 'Inter', monospace; color: #cdd6f4; user-select: none; cursor: none; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }

    /* HUD overlay */
    #hud {
      position: absolute;
      top: 24px;
      left: 28px;
      pointer-events: none;
      z-index: 100;
      opacity: 1;
      transition: opacity 1.2s ease-out;
    }
    #hud.faded { opacity: 0; }
    .badge-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .tag {
      background: rgba(203, 166, 247, 0.12);
      border: 1px solid rgba(203, 166, 247, 0.35);
      color: #cba6f7;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
    }
    .theme-title {
      font-size: 14px;
      font-weight: 700;
      color: #f5e0dc;
      letter-spacing: 0.18em;
      margin-top: 6px;
      text-shadow: 0 0 12px rgba(203, 166, 247, 0.6);
    }
    .hints {
      font-size: 10px;
      color: #6c7086;
      margin-top: 6px;
      letter-spacing: 0.08em;
    }

    /* Subtle scanline overlay */
    #scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 50;
      opacity: 0.65;
    }
    /* Vignette */
    #vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.85);
      z-index: 51;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="view"></canvas>
  </div>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div class="badge-bar">
      <span class="tag">OMARCHY // CYBER-SYS</span>
      <span id="fps" style="color: #a6e3a1;">60 FPS</span>
      <span id="res" style="color: #89b4fa;">4K UHD</span>
    </div>
    <div class="theme-title" id="theme-name">1. LIQUID CHROMIUM // Y2K MERCURY</div>
    <div class="hints">[1-5] Switch Theme · [SPACE] Cycle · [G] Glitch Pulse · [H] HUD · [F] Fullscreen · [ESC] Exit</div>
  </div>

  <script>
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const themeNameEl = document.getElementById('theme-name');
    const fpsEl = document.getElementById('fps');
    const resEl = document.getElementById('res');

    let width = 0, height = 0, dpr = 1;
    let currentTheme = 4;
    const TOTAL_THEMES = 5;
    let t = 0;
    let glitchIntensity = 0;
    let glitchDuration = 0;
    let hudTimer = null;
    let exitOnMove = false;
    let initialMouseMoveIgnored = 0;

    const THEMES = [
      { id: 1, name: "1. LIQUID CHROMIUM // Y2K MERCURY", desc: "Fluid metallic dispersion & chromatic waves" },
      { id: 2, name: "2. GEOMORPHIC TESSERACT // HYPER-LATTICE", desc: "4D sacred wireframe geometry & neon depth" },
      { id: 3, name: "3. CYBER GLITCH // QUANTUM HORIZON", desc: "Raster displacement, scanline tearing & cyber grid" },
      { id: 4, name: "4. CHROMATIC AURORA // SUBTLE FLUID NEBULA", desc: "Atmospheric multi-harmonic spectral ribbons" },
      { id: 5, name: "5. OMARCHY ASCII // KINETIC MATRIX", desc: "Programmatic monospace kinetic emblem & telemetry" }
    ];

    // Check URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('screensaver') === '1') exitOnMove = true;
    if (urlParams.get('theme')) {
      const paramTheme = parseInt(urlParams.get('theme'), 10);
      if (paramTheme >= 1 && paramTheme <= TOTAL_THEMES) currentTheme = paramTheme;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2 for performance on UHD 620
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      resEl.textContent = `${width}x${height} @${dpr.toFixed(1)}x`;
    }
    window.addEventListener('resize', resize);
    resize();

    function triggerHud() {
      hud.classList.remove('faded');
      themeNameEl.textContent = THEMES[currentTheme - 1].name;
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => { hud.classList.add('faded'); }, 3500);
    }
    triggerHud();

    // ─────────────────────────────────────────────────────────────────────────
    // THEME 1: Liquid Chromium (Y2K Fluid Mercury)
    // ─────────────────────────────────────────────────────────────────────────
    function renderLiquidChrome() {
      ctx.fillStyle = '#090812';
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;
      const rings = 28;
      const maxRadius = Math.hypot(cx, cy) * 0.95;

      for (let i = 0; i < rings; i++) {
        const norm = i / rings;
        const r = norm * maxRadius;
        const wave = Math.sin(t * 0.8 + norm * 8) * 16 * Math.cos(t * 0.4 + norm * 4);
        const radius = r + wave;

        // Chromatic split: render Red, Green, Blue offsets
        const channels = [
          { stroke: 'rgba(243, 139, 168, 0.16)', offset: 3 }, // Pink/Mauve
          { stroke: 'rgba(180, 190, 254, 0.22)', offset: 0 }, // Lavender
          { stroke: 'rgba(116, 199, 236, 0.18)', offset: -3 } // Sapphire/Cyan
        ];

        for (const ch of channels) {
          ctx.beginPath();
          ctx.strokeStyle = ch.stroke;
          ctx.lineWidth = 1.6 + (1 - norm) * 2.2;
          const points = 64;

          for (let p = 0; p <= points; p++) {
            const angle = (p / points) * Math.PI * 2;
            const morph = Math.sin(angle * 4 + t * 0.6 + norm * 3) * (20 * norm)
                        + Math.cos(angle * 7 - t * 0.4) * (12 * (1 - norm));
            const pr = radius + morph + ch.offset;
            const px = cx + Math.cos(angle) * pr;
            const py = cy + Math.sin(angle) * pr;
            if (p === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
        }
      }

      // Specular mercury nucleus
      const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 180);
      grad.addColorStop(0, 'rgba(203, 166, 247, 0.35)');
      grad.addColorStop(0.4, 'rgba(116, 199, 236, 0.12)');
      grad.addColorStop(1, 'rgba(11, 11, 18, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 180, 0, Math.PI * 2);
      ctx.fill();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // THEME 2: Geomorphic Tesseract (Sacred 4D Wireframe Geometry)
    // ─────────────────────────────────────────────────────────────────────────
    // 4D hypercube vertices (16 points in {-1, 1}^4)
    const tesseractVertices = [];
    for (let x = -1; x <= 1; x += 2) {
      for (let y = -1; y <= 1; y += 2) {
        for (let z = -1; z <= 1; z += 2) {
          for (let w = -1; w <= 1; w += 2) {
            tesseractVertices.push([x, y, z, w]);
          }
        }
      }
    }
    // 32 edges connecting vertices that differ by exactly 1 coordinate
    const tesseractEdges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i + 1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (tesseractVertices[i][k] !== tesseractVertices[j][k]) diff++;
        }
        if (diff === 1) tesseractEdges.push([i, j]);
      }
    }

    function renderGeomorphicMatrix() {
      ctx.fillStyle = '#080811';
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;
      const scale = Math.min(width, height) * 0.28;

      // 4D rotations (XW and ZW planes)
      const theta = t * 0.45;
      const phi = t * 0.32;
      const cosT = Math.cos(theta), sinT = Math.sin(theta);
      const cosP = Math.cos(phi), sinP = Math.sin(phi);

      const projected = tesseractVertices.map(v => {
        let [x, y, z, w] = v;
        // Rotate XW
        const x1 = x * cosT - w * sinT;
        const w1 = x * sinT + w * cosT;
        // Rotate ZW
        const z2 = z * cosP - w1 * sinP;
        const w2 = z * sinP + w1 * cosP;

        // Perspective 4D -> 3D projection
        const dist4D = 2.4;
        const p4 = 1 / (dist4D - w2);
        const x3 = x1 * p4;
        const y3 = y * p4;
        const z3 = z2 * p4;

        // Perspective 3D -> 2D
        const dist3D = 2.8;
        const p3 = 1 / (dist3D - z3);
        return {
          x: cx + x3 * p3 * scale * 2.2,
          y: cy + y3 * p3 * scale * 2.2,
          z: z3,
          w: w2
        };
      });

      // Render Chromatic edges with depth glow
      for (const [i, j] of tesseractEdges) {
        const p1 = projected[i];
        const p2 = projected[j];
        const avgDepth = (p1.z + p2.z) * 0.5;
        const alpha = Math.max(0.12, Math.min(0.85, 0.45 + avgDepth * 0.6));

        // Chromatic aberration pass
        ctx.beginPath();
        ctx.strokeStyle = `rgba(243, 139, 168, ${alpha * 0.4})`; // Red/Mauve fringe
        ctx.lineWidth = 1.4;
        ctx.moveTo(p1.x - 1.5, p1.y - 1);
        ctx.lineTo(p2.x - 1.5, p2.y - 1);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = `rgba(180, 190, 254, ${alpha * 0.9})`; // Lavender/Cyan core
        ctx.lineWidth = 1.8;
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = `rgba(116, 199, 236, ${alpha * 0.4})`; // Cyan fringe
        ctx.lineWidth = 1.4;
        ctx.moveTo(p1.x + 1.5, p1.y + 1);
        ctx.lineTo(p2.x + 1.5, p2.y + 1);
        ctx.stroke();
      }

      // Vertices nodes
      for (const p of projected) {
        ctx.fillStyle = '#f5e0dc';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Outer concentric sacred circles
      ctx.strokeStyle = 'rgba(203, 166, 247, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, scale * 1.35, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // THEME 3: Cyber Glitch (Horizon Grid & Digital Glitch Tearing)
    // ─────────────────────────────────────────────────────────────────────────
    function renderCyberGlitch() {
      ctx.fillStyle = '#06060c';
      ctx.fillRect(0, 0, width, height);

      const horizon = height * 0.52;
      const fov = 320;
      const speed = (t * 60) % 50;

      // Perspective 3D ground grid
      ctx.lineWidth = 1.2;
      const lines = 18;
      for (let i = 0; i < lines; i++) {
        const z = ((i * 50 - speed + 900) % 900) + 15;
        const py = horizon + (fov / z) * 140;
        if (py > height) continue;
        const alpha = Math.min(1, (py - horizon) / (height - horizon));
        ctx.strokeStyle = `rgba(203, 166, 247, ${alpha * 0.45})`;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(width, py);
        ctx.stroke();
      }

      // Vanishing longitudinal grid lines
      const cols = 26;
      for (let c = -cols; c <= cols; c++) {
        const spread = c * 75;
        ctx.strokeStyle = 'rgba(116, 199, 236, 0.22)';
        ctx.beginPath();
        ctx.moveTo(width / 2, horizon);
        ctx.lineTo(width / 2 + spread * 3.5, height);
        ctx.stroke();
      }

      // Retro horizon neon sun / gateway
      const sunY = horizon - 20;
      const sunR = Math.min(width, height) * 0.16;
      const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
      sunGrad.addColorStop(0, 'rgba(243, 139, 168, 0.85)');
      sunGrad.addColorStop(0.6, 'rgba(203, 166, 247, 0.5)');
      sunGrad.addColorStop(1, 'rgba(11, 11, 18, 0)');

      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(width / 2, sunY, sunR, Math.PI, 0, false);
      ctx.fill();

      // Horizontal sun blind slits
      for (let s = 1; s <= 6; s++) {
        const sy = sunY - sunR * 0.15 + s * 12;
        ctx.fillStyle = '#06060c';
        ctx.fillRect(width / 2 - sunR, sy, sunR * 2, 2.5 + s * 0.8);
      }

      // Digital Glitch Tearing
      if (glitchDuration > 0 || Math.random() < 0.04) {
        const slices = Math.floor(Math.random() * 4) + 1;
        for (let s = 0; s < slices; s++) {
          const sy = Math.random() * height;
          const sh = Math.random() * 28 + 6;
          const shift = (Math.random() - 0.5) * 45;

          try {
            const imgData = ctx.getImageData(0, Math.max(0, sy), width, Math.min(sh, height - sy));
            ctx.putImageData(imgData, shift, sy);
            // Draw subtle chromatic glitch bar
            ctx.fillStyle = Math.random() < 0.5 ? 'rgba(243, 139, 168, 0.15)' : 'rgba(116, 199, 236, 0.15)';
            ctx.fillRect(0, sy, width, sh);
          } catch(e) {}
        }
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // THEME 4: Chromatic Aurora (Fluid Spectral Ribbons & Transforming Patterns)
    // Twisting ribbons + ECG pulse, Music EQ visualizer, Pac-Man, Space Invaders
    // ─────────────────────────────────────────────────────────────────────────
    function renderChromaticAurora() {
      ctx.fillStyle = '#030308';
      ctx.fillRect(0, 0, width, height);

      // Deep celestial twinkling starfield
      const stars = 90;
      for (let s = 0; s < stars; s++) {
        const sx = ((s * 197.3 + t * 4) % width);
        const sy = ((s * 313.7) % (height * 0.72));
        const sa = (Math.sin(t * 1.8 + s) + 1) * 0.35 + 0.12;
        ctx.fillStyle = `rgba(205, 214, 244, ${sa})`;
        ctx.fillRect(sx, sy, s % 3 === 0 ? 1.8 : 1.2, s % 3 === 0 ? 1.8 : 1.2);
      }

      // 1. Multi-harmonic Twisting Aurora Ribbons with Depth Rotation
      const ribbons = 5;
      for (let r = 0; r < ribbons; r++) {
        const norm = r / ribbons;
        const baseY = height * (0.32 + norm * 0.28);
        const grad = ctx.createLinearGradient(0, baseY - 90, 0, baseY + 160);

        if (r % 3 === 0) {
          grad.addColorStop(0, 'rgba(203, 166, 247, 0)');
          grad.addColorStop(0.4, 'rgba(203, 166, 247, 0.22)');
          grad.addColorStop(0.8, 'rgba(180, 190, 254, 0.12)');
          grad.addColorStop(1, 'rgba(180, 190, 254, 0)');
        } else if (r % 3 === 1) {
          grad.addColorStop(0, 'rgba(148, 226, 213, 0)');
          grad.addColorStop(0.4, 'rgba(148, 226, 213, 0.24)');
          grad.addColorStop(0.8, 'rgba(116, 199, 236, 0.15)');
          grad.addColorStop(1, 'rgba(116, 199, 236, 0)');
        } else {
          grad.addColorStop(0, 'rgba(243, 139, 168, 0)');
          grad.addColorStop(0.4, 'rgba(243, 139, 168, 0.20)');
          grad.addColorStop(0.8, 'rgba(203, 166, 247, 0.12)');
          grad.addColorStop(1, 'rgba(203, 166, 247, 0)');
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, height);

        const steps = 60;
        for (let s = 0; s <= steps; s++) {
          const px = (s / steps) * width;
          // Twisting wave oscillation simulating 3D helical ribbon
          const twist = Math.sin(px * 0.003 + t * 0.7 + norm * Math.PI) * Math.cos(t * 0.4 + norm);
          const wave1 = Math.sin(s * 0.16 + t * 0.6 + norm * 3.5) * (50 + twist * 25);
          const wave2 = Math.cos(s * 0.08 - t * 0.35 + norm * 2) * 32;
          const py = baseY + wave1 + wave2;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();
      }

      // ───────────────────────────────────────────────────────────────────────
      // PASSING PATTERN 1: Neon ECG Biometric Pulse Waveform
      // ───────────────────────────────────────────────────────────────────────
      const ecgY = height * 0.38;
      const ecgProgress = ((t * 220) % (width + 400)) - 200;
      ctx.save();
      ctx.shadowColor = '#89dceb';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = '#94e2d5';
      ctx.lineWidth = 2.2;
      ctx.beginPath();

      const ecgWindow = 320;
      const startX = Math.max(0, ecgProgress - ecgWindow);
      const endX = Math.min(width, ecgProgress + 50);

      for (let x = startX; x <= endX; x += 4) {
        const rel = (x - (ecgProgress - 120));
        let dy = 0;
        if (rel > -50 && rel < -30) {
          // P-Wave
          dy = -Math.sin((rel + 50) / 20 * Math.PI) * 12;
        } else if (rel >= -30 && rel < -20) {
          // Q-Dip
          dy = Math.sin((rel + 30) / 10 * Math.PI) * 16;
        } else if (rel >= -20 && rel < 0) {
          // R-Spike (tall)
          dy = -Math.sin((rel + 20) / 20 * Math.PI) * 75;
        } else if (rel >= 0 && rel < 15) {
          // S-Valley
          dy = Math.sin(rel / 15 * Math.PI) * 26;
        } else if (rel >= 15 && rel < 50) {
          // T-Wave
          dy = -Math.sin((rel - 15) / 35 * Math.PI) * 20;
        }
        const y = ecgY + dy + Math.sin(x * 0.01 + t) * 6;
        if (x === startX) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // ECG leading head dot
      if (ecgProgress >= 0 && ecgProgress <= width) {
        ctx.fillStyle = '#f5e0dc';
        ctx.beginPath();
        ctx.arc(ecgProgress, ecgY + Math.sin(ecgProgress * 0.01 + t) * 6, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ───────────────────────────────────────────────────────────────────────
      // PASSING PATTERN 2: Dynamic Music Equalizer / Audio Spectrum Visualizer
      // ───────────────────────────────────────────────────────────────────────
      const eqY = height * 0.65;
      const eqBars = 36;
      const barW = 10;
      const barGap = 6;
      const totalEqW = eqBars * (barW + barGap);
      const eqStartX = (width - totalEqW) / 2;

      ctx.save();
      for (let b = 0; b < eqBars; b++) {
        const bx = eqStartX + b * (barW + barGap);
        // Harmonic frequencies with beat pulse
        const freq = Math.sin(b * 0.35 + t * 3.5) * 0.5 + Math.cos(b * 0.8 - t * 2.2) * 0.3;
        const beat = Math.pow(Math.sin(t * 2.8 + (b / eqBars) * 1.5), 4) * 45;
        const hVal = Math.max(8, (Math.abs(freq) * 75 + beat + 12));

        const barGrad = ctx.createLinearGradient(0, eqY, 0, eqY - hVal);
        barGrad.addColorStop(0, 'rgba(180, 190, 254, 0.25)');
        barGrad.addColorStop(0.7, 'rgba(203, 166, 247, 0.85)');
        barGrad.addColorStop(1, 'rgba(245, 194, 231, 0.95)');

        ctx.fillStyle = barGrad;
        ctx.fillRect(bx, eqY - hVal, barW, hVal);

        // Floating peak indicator dot
        const peakY = eqY - hVal - 4 - Math.abs(Math.sin(t * 1.5 + b)) * 6;
        ctx.fillStyle = '#cba6f7';
        ctx.fillRect(bx, peakY, barW, 2);
      }
      ctx.restore();

      // ───────────────────────────────────────────────────────────────────────
      // PASSING PATTERN 3: Single-Line Pac-Man Eating Energizer Pellets & Ghost
      // ───────────────────────────────────────────────────────────────────────
      const pacY = height * 0.80;
      const pacProgress = ((t * 115) % (width + 360)) - 180;
      const chomp = Math.abs(Math.sin(t * 9)) * 0.28 * Math.PI;

      ctx.save();
      // Glowing pellets ahead of Pac-Man
      const pelletSpacing = 42;
      for (let px = 0; px < width; px += pelletSpacing) {
        if (px > pacProgress + 16) {
          const pAlpha = 0.45 + Math.sin(px * 0.05 + t * 4) * 0.3;
          ctx.fillStyle = `rgba(250, 227, 176, ${pAlpha})`;
          ctx.beginPath();
          ctx.arc(px, pacY, px % (pelletSpacing * 4) === 0 ? 4 : 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Pac-Man Body
      if (pacProgress > -30 && pacProgress < width + 30) {
        ctx.shadowColor = '#f9e2af';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#f9e2af';
        ctx.beginPath();
        ctx.arc(pacProgress, pacY, 13, chomp, Math.PI * 2 - chomp);
        ctx.lineTo(pacProgress, pacY);
        ctx.closePath();
        ctx.fill();

        // Chasing Ghost (Blinky / Pinky style)
        const ghostX = pacProgress - 65;
        if (ghostX > -30 && ghostX < width + 30) {
          ctx.shadowColor = '#f38ba8';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#f38ba8';
          ctx.beginPath();
          ctx.arc(ghostX, pacY - 4, 11, Math.PI, 0, false);
          ctx.lineTo(ghostX + 11, pacY + 8);
          // Wavy skirt
          const wavePhase = Math.sin(t * 12);
          ctx.lineTo(ghostX + 6, pacY + 5 + wavePhase * 2);
          ctx.lineTo(ghostX, pacY + 8);
          ctx.lineTo(ghostX - 6, pacY + 5 - wavePhase * 2);
          ctx.lineTo(ghostX - 11, pacY + 8);
          ctx.closePath();
          ctx.fill();

          // Ghost Eyes
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ghostX + 3, pacY - 4, 3, 0, Math.PI * 2);
          ctx.arc(ghostX - 4, pacY - 4, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#1e1e2e';
          ctx.beginPath();
          ctx.arc(ghostX + 4.5, pacY - 4, 1.5, 0, Math.PI * 2);
          ctx.arc(ghostX - 2.5, pacY - 4, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // ───────────────────────────────────────────────────────────────────────
      // PASSING PATTERN 4: Space Invaders Pixel March
      // ───────────────────────────────────────────────────────────────────────
      const invY = height * 0.16;
      const invSpeed = 70;
      const invBaseX = ((t * invSpeed) % (width + 300)) - 150;
      const invFrame = Math.floor(t * 3.5) % 2;

      ctx.save();
      ctx.font = '16px monospace';
      ctx.fillStyle = '#a6e3a1';
      ctx.shadowColor = '#a6e3a1';
      ctx.shadowBlur = 6;

      const aliens = [
        invFrame === 0 ? "👾" : "👾",
        invFrame === 0 ? "🛸" : "🛸",
        invFrame === 0 ? "👾" : "👾"
      ];
      for (let i = 0; i < aliens.length; i++) {
        const ax = invBaseX + i * 48;
        if (ax > -50 && ax < width + 50) {
          ctx.fillText(aliens[i], ax, invY + Math.sin(ax * 0.02 + t * 2) * 5);
          // Laser beam dropped occasionally
          if ((Math.floor(ax + t * 20) % 180) < 15) {
            ctx.fillStyle = '#fab387';
            ctx.fillRect(ax + 7, invY + 10, 2, 14);
            ctx.fillStyle = '#a6e3a1';
          }
        }
      }
      ctx.restore();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // THEME 5: Omarchy Kinetic ASCII + Chrome Glow Telemetry Marquee Scroller
    // ─────────────────────────────────────────────────────────────────────────
    const ASCII_LOGO = [
      "   █████████  ███    ███  ███   ███  █████████     ████████  ",
      "  ███░░░░░███░███   ░░███░███  ░███ ░███░░░░░███  ███░░░░███ ",
      " ░███    ░░░ ░███    ░███░███  ░███ ░███    ░███ ░███   ░░░  ",
      " ░░█████████ ░███    ░███░█████████ ░█████████   ░░████████  ",
      "  ░░░░░░░░███░░███   ███ ░░░░░░░███ ░███░░░░░      ░░░░░░███ ",
      "  ███    ░███ ░░░█████░    ░███ ░███ ░███        ███   ░███  ",
      " ░░█████████    ░░███      ░░██████  █████      ░░████████   ",
      "  ░░░░░░░░░      ░░░        ░░░░░░  ░░░░░        ░░░░░░░░    "
    ];

    // Comprehensive Live System Telemetry Banner Ticker
    const SYSTEM_TELEMETRY_ITEMS = [
      "⚡ [DELL LATITUDE 7490 // INTEL CORE i5-8350U 4C/8T @ 3.6GHz]",
      "◈ [THROTTLED: 25W SUSTAINED PL1 // INTEL-UNDERVOLT ACTIVE]",
      "◈ [MEMORY: 24GB DDR4 DUAL-CH // 8GB ZRAM zstd swappiness=180]",
      "◈ [GRAPHICS: INTEL UHD 620 // MESA VA-API ACCEL // eDP-1 1080p 60Hz]",
      "◈ [OS: ENDEAVOUR ARCH LINUX ROLLING 64-BIT // KERNEL BBR CONGESTION]",
      "◈ [PRIVACY: MAC-RAND ACTIVE // DoT QUAD9 9.9.9.9:853 TLS // RFC4941 IPv6]",
      "◈ [STEALTH FIREWALL: REJECT/DROP ALL UNSOLICITED INCOMING]",
      "◈ [RF POSTURE: wlan0 DEDICATED PASSIVE MONITOR // enp0s31f6 UPLINK]",
      "◈ [SYNAPSE RUNTIME GATEWAY :8000 // CONTEXT FIREWALL BIDIRECTIONAL]",
      "◈ [LOCAL LLM: OLLAMA qwen2.5-coder:latest RESIDENT (24H WARM)]",
      "◈ [AUDIO: PIPEWIRE 1.6 WIREPLUMBER // A2DP SBC-XQ AUDIOPHILE]",
      "◈ [SCHEDULER: ANANICY-CPP PROCESS PRIORITIZATION ACTIVE]",
      "◈ [SECURITY GATES: TIER-1 ENTROPY + TIER-2 AI DIFF AUDIT ENGAGED]",
      "◈ [HEX: 0x7FFF5FBFFD00 // SYNAPSEOS HYPERSTRUCTURE NOMINAL]"
    ];
    const TELEMETRY_STREAM = "   " + SYSTEM_TELEMETRY_ITEMS.join("   ") + "   ";

    function renderOmarchyAscii() {
      ctx.fillStyle = '#06060c';
      ctx.fillRect(0, 0, width, height);

      ctx.font = '13px "JetBrains Mono", monospace';
      const charW = 14;
      const charH = 20;
      const cols = Math.floor(width / charW);
      const rows = Math.floor(height / charH);

      // 1. Subtle background cyber telemetry rain
      for (let r = 0; r < rows - 3; r += 2) {
        for (let c = 0; c < cols; c += 3) {
          const seed = Math.sin(c * 12.3 + r * 45.6 + t * 0.4);
          if (seed > 0.74) {
            const glyphs = "01011001_ΔΩ∑∫≈≠√░▒▓><[]{}/*⚡◈";
            const char = glyphs[Math.floor(Math.abs(seed * 100)) % glyphs.length];
            ctx.fillStyle = 'rgba(180, 190, 254, 0.085)';
            ctx.fillText(char, c * charW, r * charH);
          }
        }
      }

      // 2. Render Kinetic Logo in Center with Glitch Offsets
      const logoLines = ASCII_LOGO.length;
      const logoCols = ASCII_LOGO[0].length;
      const startX = Math.max(20, (width - logoCols * 11) / 2);
      const startY = (height - logoLines * 18) / 2 - 25;

      ctx.font = 'bold 15px monospace';
      for (let l = 0; l < logoLines; l++) {
        const line = ASCII_LOGO[l];
        let lineShift = 0;
        if (Math.random() < 0.05) lineShift = (Math.random() - 0.5) * 16;

        for (let ch = 0; ch < line.length; ch++) {
          const char = line[ch];
          if (char === ' ') continue;

          const px = startX + ch * 11 + lineShift;
          const py = startY + l * 18;
          const wave = Math.sin(t * 2.2 + ch * 0.22 + l * 0.4);

          // Liquid chrome-to-violet glow
          ctx.fillStyle = wave > 0 ? '#cba6f7' : '#89b4fa';
          ctx.fillText(char, px, py);
        }
      }

      // Static subheader badge
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = '#6c7086';
      const centerBadge = `[ SYNAPSE HYPERSTRUCTURE // ARCH ENGINE // T+${t.toFixed(1)}s ]`;
      ctx.fillText(centerBadge, (width - ctx.measureText(centerBadge).width) / 2, startY + logoLines * 18 + 36);

      // ───────────────────────────────────────────────────────────────────────
      // 3. SINGLE-LINE CONTINUOUS HORIZONTAL SCROLLER WITH LIQUID CHROME GLOW
      // ───────────────────────────────────────────────────────────────────────
      const scrollerY = height - 42;
      const scrollerHeight = 36;

      // Scroller background track
      ctx.fillStyle = 'rgba(13, 17, 23, 0.78)';
      ctx.fillRect(0, scrollerY - 24, width, scrollerHeight);
      ctx.strokeStyle = 'rgba(124, 194, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, scrollerY - 24, width, scrollerHeight);

      // Measure total string width
      ctx.font = 'bold 12.5px "JetBrains Mono", monospace';
      const totalTextWidth = ctx.measureText(TELEMETRY_STREAM).width;
      const scrollSpeed = 75; // pixels per second
      const offset = (t * scrollSpeed) % totalTextWidth;

      // Chrome glow gradient setup
      const chromeGrad = ctx.createLinearGradient(0, scrollerY - 20, 0, scrollerY);
      chromeGrad.addColorStop(0, '#ffffff');      // bright chrome highlight
      chromeGrad.addColorStop(0.35, '#e2e8f0');   // polished silver
      chromeGrad.addColorStop(0.7, '#7cc2ff');    // radiant cyber cyan
      chromeGrad.addColorStop(1, '#cba6f7');      // soft catppuccin mauve

      ctx.save();
      ctx.shadowColor = 'rgba(124, 194, 255, 0.85)';
      ctx.shadowBlur = 9;
      ctx.fillStyle = chromeGrad;

      // Draw two adjacent copies for continuous wrapping
      ctx.fillText(TELEMETRY_STREAM, -offset, scrollerY);
      ctx.fillText(TELEMETRY_STREAM, -offset + totalTextWidth, scrollerY);
      ctx.restore();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // MAIN ANIMATION LOOP
    // ─────────────────────────────────────────────────────────────────────────
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTime = lastTime;

    function animate(now) {
      const dt = (now - lastTime) * 0.001;
      lastTime = now;
      t += Math.min(dt, 0.1);

      frameCount++;
      if (now - fpsTime >= 1000) {
        fpsEl.textContent = `${frameCount} FPS`;
        frameCount = 0;
        fpsTime = now;
      }

      if (glitchDuration > 0) glitchDuration -= dt;

      switch (currentTheme) {
        case 1: renderLiquidChrome(); break;
        case 2: renderGeomorphicMatrix(); break;
        case 3: renderCyberGlitch(); break;
        case 4: renderChromaticAurora(); break;
        case 5: renderOmarchyAscii(); break;
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // ─────────────────────────────────────────────────────────────────────────
    // CONTROLS & EVENT LISTENERS
    // ─────────────────────────────────────────────────────────────────────────
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        currentTheme = parseInt(e.key, 10);
        triggerHud();
      } else if (e.key === ' ' || e.key === 'Tab') {
        e.preventDefault();
        currentTheme = (currentTheme % TOTAL_THEMES) + 1;
        triggerHud();
      } else if (e.key.toLowerCase() === 'h') {
        hud.classList.toggle('faded');
      } else if (e.key.toLowerCase() === 'g') {
        glitchDuration = 0.5;
      } else if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'q') {
        window.close();
      }
    });

    // Exit handling in screensaver mode (grace period + distance threshold)
    let armed = false;
    let startX = null, startY = null;
    setTimeout(() => { armed = true; }, 2500);

    window.addEventListener('mousemove', (e) => {
      if (!exitOnMove || !armed) return;
      if (startX === null) {
        startX = e.clientX;
        startY = e.clientY;
        return;
      }
      const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if (dist > 80) {
        window.close();
      }
    });

    window.addEventListener('mousedown', () => {
      if (exitOnMove && armed) {
        window.close();
      }
    });
  </script>
